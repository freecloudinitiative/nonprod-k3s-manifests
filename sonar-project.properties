# Repository identity is supplied by CI so this file can be reused across the organization.
sonar.sources=applications,infrastructure
sonar.tests=applications/database-service/tests
sonar.test.inclusions=applications/**/tests/**/*.yaml

sonar.exclusions=**/charts/**,**/vendor/**,**/generated/**
sonar.cpd.exclusions=applications/**/tests/**,**/templates/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
