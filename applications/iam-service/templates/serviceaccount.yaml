{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iam-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iam-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken is false — iam-service never calls the
# Kubernetes API. Contrast compute-service and storage-service which both
# set this true because they are genuine API clients.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
