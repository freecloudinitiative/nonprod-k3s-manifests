replicaCount: 2

image:
  repository: ghcr.io/freecloudinitiative/database-service
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  metricsPort: 9090

# An in-flight COPY should finish its transaction before kubelet sends SIGKILL.
terminationGracePeriodSeconds: 90

# Imports spool and stream files up to 12 MiB, and the customer connection pool
# can retain buffers for as many as 100 concurrent connections. These are
# intentionally higher than the ordinary backend-service defaults.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 1
    memory: 1Gi
    ephemeral-storage: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Secret volume files are owned by root:root unless fsGroup is set; without
  # it, a non-root container can't read the 0400 signing-key file it mounts
  # to mint internal JWTs. Matches api-gateway's podSecurityContext, the
  # other chart that mounts its own private signing key.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# database-service calls the Kubernetes API to reconcile CNPG resources. The
# token mount is intentional; RBAC limits writes to explicitly bound customers.
automountServiceAccountToken: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # k3s's default kubernetes Service address. Override for another service CIDR.
  kubernetesAPIServerCIDR: 10.43.0.1/32

kubernetes:
  enabled: true
  namespacePrefix: fci-cust-

backup:
  enabled: false
  endpoint: ""
  bucket: ""
  region: ""
  credentialsSecret: database-backup-s3
  schedule: "0 3 * * *"
  retentionDays: 7

metrics:
  enabled: true
  prometheusURL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  cacheTTL: 15s

connectionPool:
  perDatabase: 10
  global: 100
  maxPerDatabase: 4
  idleTTL: 60s
  acquireTimeout: 2s

import:
  concurrencyPerDatabase: 2
  # Below api-gateway MAX_BODY_BYTES (12582912) and nginx client_max_body_size
  # (12m). Multipart envelope adds boundary and options part on top of file, so
  # file ceiling must sit under transport ceiling.
  maxBytes: "10485760"

config:
  logLevel: info
  environment: production
  databaseSchema: database
  databaseMaxConnections: 10
  iamServiceURL: http://iam-service.backend.svc.cluster.local
  # compute-service owns customer namespace provisioning. Without this,
  # database creation returns 412 namespace_missing for any account that has
  # never created a compute engine. Requires INTERNAL_SIGNING_KEY_PATH to
  # also be set (already wired by PR-01) — database-service's config
  # validation fails closed at boot if only one of the pair is set.
  computeServiceURL: http://compute-service.backend.svc.cluster.local
  computeTimeout: 10s
  valkeyURL: valkey.valkey.svc.cluster.local:6379
  # bare host:port, no scheme — platform-common rejects a URL scheme for OTLP gRPC
  otelEndpoint: opentelemetry-collector.monitoring.svc.cluster.local:4317
  shutdownGrace: 75s

# TTL for internal JWTs database-service mints with its own signing key to
# call iam-service's quota route.
internalTokenTTL: 60s

secrets:
  database:
    secretName: database-service-config
    keyName: DATABASE_URL
  postgresCACert:
    # Projected into backend by the k3s-manifests companion PR.
    secretName: platform-postgresql-ca-bundle
    keyName: ca.crt
  # database-service's own Ed25519 private key, used to mint internal JWTs
  # for calls to iam-service's quota route.
  signingKey:
    secretName: database-service-signing-key
    keyName: internal-signing.key
  internalPublicKey:
    secretName: internal-token-public-key
    keyName: internal-public.pem
  valkey:
    secretName: valkey-password
    keyName: password
  valkeyCACert:
    secretName: valkey-ca-cert
    keyName: ca.crt

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
