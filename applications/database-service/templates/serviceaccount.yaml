apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "database-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-service.labels" . | nindent 4 }}
# Required for CNPG reconciliation. Its cluster-wide binding is read-only;
# customer writes exist only through explicitly namespaced RoleBindings.
automountServiceAccountToken: true
