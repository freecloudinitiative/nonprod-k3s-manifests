apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "database-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "database-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "database-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "database-service.fullname" . }}
      # The reconciler calls the Kubernetes API; this token is intentional.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: database-service
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "database-service.fullname" . }}
          env:
            # Downward API fields are attached to OTel resource attributes.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.secretName }}
                  key: {{ .Values.secrets.database.keyName }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.valkey.secretName }}
                  key: {{ .Values.secrets.valkey.keyName }}
          volumeMounts:
            - name: postgres-ca-cert
              mountPath: /certs/platform-postgresql
              readOnly: true
            - name: signing-key
              mountPath: /etc/fci/signing
              readOnly: true
            - name: internal-public-key
              mountPath: /etc/fci/internal-token
              readOnly: true
            - name: valkey-ca-cert
              mountPath: /etc/fci/valkey
              readOnly: true
            # PR-07 spools uploads here. It must remain writable while the image
            # root filesystem remains read-only.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: postgres-ca-cert
          secret:
            secretName: {{ .Values.secrets.postgresCACert.secretName }}
            items:
              - key: {{ .Values.secrets.postgresCACert.keyName }}
                path: ca.crt
            defaultMode: 0444
        - name: signing-key
          secret:
            secretName: {{ .Values.secrets.signingKey.secretName }}
            items:
              - key: {{ .Values.secrets.signingKey.keyName }}
                path: internal-signing.key
            defaultMode: 0400
        - name: internal-public-key
          secret:
            secretName: {{ .Values.secrets.internalPublicKey.secretName }}
            items:
              - key: {{ .Values.secrets.internalPublicKey.keyName }}
                path: internal-public.pem
            defaultMode: 0444
        - name: valkey-ca-cert
          secret:
            secretName: {{ .Values.secrets.valkeyCACert.secretName }}
            items:
              - key: {{ .Values.secrets.valkeyCACert.keyName }}
                path: ca.crt
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
