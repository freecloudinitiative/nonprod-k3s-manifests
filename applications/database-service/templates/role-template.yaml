# role-template.yaml — the namespace-scoped write grant, expressed as a
# second ClusterRole rather than a namespaced Role.
#
# Customer namespaces are created by compute-service, not by this Helm
# release, so this chart cannot know their names at deploy time and cannot
# create a namespaced Role in each one. Instead this ClusterRole is a
# *template*: it defines exactly the verb set a customer namespace's
# RoleBinding should grant, and compute-service's per-namespace RBAC
# provisioning (compute-service/internal/k8s/rbac.go) creates a
# namespace-scoped RoleBinding referencing this ClusterRole by name whenever
# it provisions a customer namespace.
#
# This ClusterRole is intentionally NOT referenced by any ClusterRoleBinding
# in this chart. Doing so would grant CNPG Cluster/backup and Secret write
# access cluster-wide, including in platform namespaces. It only takes
# effect where a namespace-scoped RoleBinding names it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "database-service.fullname" . }}-namespace-role
  labels:
    {{- include "database-service.labels" . | nindent 4 }}
    fci.io/rbac-scope: namespace-template
rules:
  # create, converge, observe, stop, and delete customer clusters.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # manage scheduled and on-demand customer backups.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["scheduledbackups", "backups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # read CNPG-generated credentials and maintain customer-scoped copies.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update"]
  # observe storage and delete retained PVCs during database deletion.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # observe CNPG pod readiness; exec is never required.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
