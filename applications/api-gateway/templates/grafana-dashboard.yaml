{{- if .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-dashboard
  namespace: {{ .Values.grafanaDashboard.namespace | default "monitoring" }}
  labels:
    grafana_dashboard: "1"
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  api-gateway.json: |-
    {
      "title": "API Gateway",
      "uid": "api-gateway",
      "schemaVersion": 36,
      "refresh": "30s",
      "tags": ["api-gateway", "platform"],
      "panels": [
        {
          "title": "Request Rate by Upstream",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(gateway_upstream_requests_total[5m])) by (upstream, status_class)",
              "legendFormat": "{{`{{upstream}}`}} {{`{{status_class}}`}}"
            }
          ]
        },
        {
          "title": "Error Rate by Upstream",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(gateway_upstream_errors_total[5m])) by (upstream, reason)",
              "legendFormat": "{{`{{upstream}}`}} ({{`{{reason}}`}})"
            }
          ]
        },
        {
          "title": "Upstream Latency p50/p95/p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(gateway_upstream_duration_seconds_bucket[5m])) by (upstream, le))",
              "legendFormat": "p50 {{`{{upstream}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(gateway_upstream_duration_seconds_bucket[5m])) by (upstream, le))",
              "legendFormat": "p95 {{`{{upstream}}`}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(gateway_upstream_duration_seconds_bucket[5m])) by (upstream, le))",
              "legendFormat": "p99 {{`{{upstream}}`}}"
            }
          ]
        },
        {
          "title": "Circuit Breaker State",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "gateway_breaker_state",
              "legendFormat": "{{`{{upstream}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Closed", "color": "green" }, "1": { "text": "Half-Open", "color": "yellow" }, "2": { "text": "Open", "color": "red" } } }
              ]
            }
          }
        },
        {
          "title": "Auth Failures by Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(gateway_auth_failures_total[5m])) by (reason)",
              "legendFormat": "{{`{{reason}}`}}"
            }
          ]
        },
        {
          "title": "Rate-Limit Rejections by Class",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(gateway_ratelimit_rejections_total[5m])) by (class)",
              "legendFormat": "{{`{{class}}`}}"
            }
          ]
        },
        {
          "title": "Account Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(gateway_account_cache_total{result=\"hit\"}[5m])) / sum(rate(gateway_account_cache_total[5m]))",
              "legendFormat": "Hit ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "green", "value": 0.95 }
                ]
              }
            }
          }
        },
        {
          "title": "Active WebSocket Sessions",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "targets": [
            {
              "expr": "gateway_websocket_sessions",
              "legendFormat": "Active sessions"
            }
          ]
        },
        {
          "title": "Idempotency Interactions",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(gateway_idempotency_total[5m])) by (outcome)",
              "legendFormat": "{{`{{outcome}}`}}"
            }
          ]
        }
      ]
    }
{{- end }}
