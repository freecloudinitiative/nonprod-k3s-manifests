{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default "monitoring" }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
{{ .Files.Get "rules/api-gateway.yaml" | indent 2 }}
{{- end }}
