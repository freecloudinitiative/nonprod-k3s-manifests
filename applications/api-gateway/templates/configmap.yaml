apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  SERVICE_NAME: "api-gateway"
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_PORT: "8080"
  METRICS_PORT: "9090"
  IAM_SERVICE_URL: {{ .Values.config.iamServiceURL | quote }}
  COMPUTE_SERVICE_URL: {{ .Values.config.computeServiceURL | quote }}
  DATABASE_SERVICE_URL: {{ .Values.config.databaseServiceURL | quote }}
  STORAGE_SERVICE_URL: {{ .Values.config.storageServiceURL | quote }}
  TERMINAL_GATEWAY_URL: {{ .Values.config.terminalGatewayURL | quote }}
  VALKEY_URL: {{ .Values.config.valkeyURL | quote }}
  # Path to the Valkey TLS CA cert — the Secret is mounted at the same path by
  # deploy/templates/deployment.yaml (valkey-ca-cert volume, mountPath /etc/fci/tls, path ca.crt).
  VALKEY_CA_CERT_PATH: {{ .Values.config.valkeyCACertPath | quote }}
  OIDC_ISSUER: {{ .Values.config.authentikIssuer | quote }}
  OIDC_JWKS_URL: {{ .Values.config.authentikJWKSURL | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.authentikClientID | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
{{- if not (kindIs "bool" .Values.config.consoleTicketBindIP) }}
{{- fail "config.consoleTicketBindIP must be a boolean, and must equal terminal-gateway consoleTicket.bindIP: a mismatch between mint and redeem silently disables or permanently breaks console ticket IP binding" }}
{{- end }}
  CONSOLE_TICKET_BIND_IP: {{ .Values.config.consoleTicketBindIP | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  # The signing key is mounted as a file; this variable points to the mount path.
  INTERNAL_SIGNING_KEY_PATH: "/etc/fci/keys/internal-signing.key"
