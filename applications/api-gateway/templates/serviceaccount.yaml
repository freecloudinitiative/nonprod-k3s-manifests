apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
# The gateway never calls the Kubernetes API, so it needs no Role or RoleBinding.
# automountServiceAccountToken is also disabled on the Pod spec for defence-in-depth.
automountServiceAccountToken: false
