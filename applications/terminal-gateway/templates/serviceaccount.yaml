apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terminal-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal-gateway.labels" . | nindent 4 }}
# Required for in-cluster Kubernetes discovery and pods/exec. RBAC still limits
# this credential to namespace discovery plus explicitly bound customer Roles.
automountServiceAccountToken: true
