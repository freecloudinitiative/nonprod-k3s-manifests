{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terminal-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "terminal-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # api-gateway proxies the WebSocket upgrade; there is intentionally no Ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    # PR-09 will add the ServiceMonitor; reserve only its metrics path now.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Kubernetes API server. NetworkPolicy cannot express the control-plane
    # endpoint as a namespace/pod selector, so it takes an ipBlock -- and the
    # match happens after kube-proxy has DNAT'd the kubernetes Service, so
    # these must be the apiserver's real endpoint addresses (every
    # control-plane node, on its secure port), never the 10.43.0.1 ClusterIP.
    # A rule written against the ClusterIP matches nothing and the request is
    # rejected: `dial tcp 10.43.0.1:443: connect: connection refused`.
    - to:
{{- range .Values.networkPolicy.kubernetesAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.kubernetesAPIServerPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.config.valkeyURL)._1 | default 6379 | int }}
    # OTLP trace and metrics export to OpenTelemetry collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.config.otelEndpoint)._1 | default 4317 | int }}
    # compute-service authorization and iam-service audit writes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - {protocol: TCP, port: 8080}
  {{- end }}
{{- end }}
