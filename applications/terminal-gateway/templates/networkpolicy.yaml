{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terminal-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "terminal-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # api-gateway proxies the WebSocket upgrade; there is intentionally no Ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    # PR-09 will add the ServiceMonitor; reserve only its metrics path now.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # In-cluster Kubernetes API. Keep this /32 aligned with the k3s service CIDR.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesAPIServerCIDR }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.config.valkeyURL)._1 | default 6379 | int }}
    # OTLP trace and metrics export to OpenTelemetry collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.config.otelEndpoint)._1 | default 4317 | int }}
    # compute-service authorization and iam-service audit writes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - {protocol: TCP, port: 8080}
  {{- end }}
{{- end }}
