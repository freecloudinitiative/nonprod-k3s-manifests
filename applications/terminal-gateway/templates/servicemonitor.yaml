apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "terminal-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "terminal-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
