replicaCount: 2

image:
  repository: ghcr.io/freecloudinitiative/terminal-gateway
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  metricsPort: 9090

# Long-lived terminals need substantially more drain time than ordinary HTTP
# requests. SHUTDOWN_GRACE is kept below this value so the process can finish
# its own drain and audit flush before kubelet sends SIGKILL.
terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 300m
    memory: 256Mi
    ephemeral-storage: 100Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Secret volume files are owned by root:root unless fsGroup is set; without
  # it, this non-root container cannot read the 0400 internal-signing.key it
  # mounts, and the process exits at startup. Matches every sibling chart.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Unlike most FCI services, terminal-gateway calls the Kubernetes API to open
# pods/exec streams. The token mount is intentional and covered by chart tests.
#
# This chart deliberately creates no customer-namespace RBAC. Role
# terminal-gateway-exec and its RoleBinding to this ServiceAccount are created
# by compute-service at namespace-provision time
# (compute-service/internal/k8s/rbac.go EnsureNamespaceRBAC), because customer
# namespace names are not known at deploy time. Re-adding a chart-side template
# puts Argo CD selfHeal and compute-service's reconcile loop in an ownership
# contest over the same two objects, with no error from either.
automountServiceAccountToken: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # See compute-service: Service ClusterIP traffic is rejected by kube-router
  # before these destination peers match. Ingress remains restricted.
  restrictEgress: false
  # k3s's default kubernetes Service address. Override if the cluster service
  # The apiserver's real endpoint addresses -- one /32 per control-plane
  # node -- and its secure port. NOT the kubernetes Service ClusterIP:
  # NetworkPolicy matches the post-DNAT destination, so a ClusterIP rule
  # never fires. Check with: kubectl -n default get endpoints kubernetes
  kubernetesAPIServerCIDRs:
    - 10.0.0.116/32
  kubernetesAPIServerPort: 6443

kubernetes:
  enabled: true

audit:
  enabled: true
  queueSize: 1000
  flushTimeout: 10s

session:
  maxPerAccount: 3
  idleTimeout: 15m
  maxDuration: 4h
  warningLead: 1m
  registryTTL: 2m

websocket:
  pingInterval: 30s
  pongTimeout: 10s
  maxMessageSize: 32768
  # Comma-separated origin allow-list for the WebSocket handshake.
  # MUST NOT be empty. An empty list means strict same-origin in
  # coder/websocket, and api-gateway's ReverseProxy rewrites Host to
  # terminal-gateway.backend.svc.cluster.local while leaving Origin as the
  # browser's public host — so same-origin can never match and every
  # handshake 403s. Keep in step with applications/frontend/values.yaml
  # ingress.host.
  allowedOrigins: "nonprod.freecloudinitiative.com"

consoleTicket:
  # Reject a handshake whose client IP does not match the IP the ticket was
  # minted for. MUST equal applications/api-gateway/values.yaml
  # config.consoleTicketBindIP.
  bindIP: true

config:
  logLevel: info
  environment: production
  # In-cluster service communication over Kubernetes cluster DNS uses HTTP within
  # the private backend namespace, isolated by NetworkPolicy and authenticated
  # with signed Ed25519 internal JWT bearer tokens.
  computeServiceURL: http://compute-service.backend.svc.cluster.local
  iamServiceURL: http://iam-service.backend.svc.cluster.local
  valkeyURL: valkey.valkey.svc.cluster.local:6379
  otelEndpoint: opentelemetry-collector.monitoring.svc.cluster.local:4317
  shutdownGrace: 100s

secrets:
  # This is terminal-gateway's own Ed25519 signing key. The service mints a
  # short-lived token for direct compute/iam calls; it does not mount any
  # other service's private key or a verifier key bundle.
  signingKey:
    secretName: terminal-gateway-signing-key
    keyName: internal-signing.key
  valkey:
    secretName: terminal-gateway-valkey-password
    keyName: password
  valkeyCACert:
    secretName: terminal-gateway-valkey-ca-cert
    keyName: ca.crt

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
