apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
# This pod is a static file server backed by nginx. It never calls the Kubernetes API.
# Mounting the default token is an unnecessary attack surface.
automountServiceAccountToken: false
