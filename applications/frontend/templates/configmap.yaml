apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # config.js is mounted over /usr/share/nginx/html/config.js via subPath in the Deployment.
  # public/config.js fails closed by design; this ConfigMap supplies the real production values.
  # toJson is used so that booleans (enableRealTerminal) and empty strings serialise correctly
  # without manual quoting or string concatenation.
  config.js: |
    window.__FCI_CONFIG__ = {{ .Values.config | toJson }};
