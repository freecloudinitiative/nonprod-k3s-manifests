# image -- OCI image settings.
# Exactly one of tag or digest must be set; the chart fails if both are empty.
image:
  repository: ghcr.io/freecloudinitiative/frontend
  # tag is used when digest is empty.
  tag: ""
  # digest takes precedence over tag when set (e.g. "sha256:abc123…").
  digest: ""

# replicaCount -- number of pods.
replicaCount: 2

# imagePullSecrets -- pull credentials for the private GHCR organization. Set
# via the app.yaml Helm parameter to ghcr-pull-credentials.
imagePullSecrets: []

# service -- Kubernetes Service settings.
service:
  port: 8080

# config -- runtime configuration written into /usr/share/nginx/html/config.js.
# Field names must match the RuntimeConfig interface in src/lib/runtimeConfig.ts exactly.
config:
  appEnv: nonprod
  # apiBaseUrl: empty string means same-origin through nginx — the intended production mode.
  # The frontend never needs to know the backend's internal address.
  apiBaseUrl: ""
  oidcAuthority: "https://auth.nonprod.freecloudinitiative.test/application/o/freecloudinitiative/"
  oidcClientId: "freecloudinitiative-frontend"
  oidcRedirectUri: "https://nonprod.freecloudinitiative.test/callback"
  enableRealTerminal: true
  # wsBaseUrl: empty string means same-origin; deriveSameOriginWsBase() handles it.
  wsBaseUrl: ""

# apiBackendUrl -- internal cluster address of api-gateway, injected into nginx as
# ${API_BACKEND_URL} for the /api/ and /ws/ proxy_pass directives.
# The api-gateway Kubernetes Service exposes port 80 (mapping to pod containerPort 8080).
apiBackendUrl: "http://api-gateway.backend.svc.cluster.local:80"

# ingress -- Traefik Ingress settings.
ingress:
  enabled: true
  host: nonprod.freecloudinitiative.test
  tlsSecretName: frontend-public-tls

# securityContext -- container-level security settings.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 101
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# resources -- container resource requests/limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 256Mi
