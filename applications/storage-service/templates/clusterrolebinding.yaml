# Binds the ServiceAccount to the cluster-scoped, read-only ClusterRole
# only. The write-capable role-template.yaml ClusterRole has no binding
# here by design — see its comment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "storage-service.fullname" . }}-cluster
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "storage-service.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "storage-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
