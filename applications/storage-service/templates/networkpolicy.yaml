{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "storage-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "storage-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # api-gateway and other backend-namespace peers reach the API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    # Prometheus scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # platform-database (Postgres)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-database
      ports:
        - protocol: TCP
          port: 5432
    # valkey (quota cache)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # Kubernetes API server. NetworkPolicy cannot express the control-plane
    # endpoint as a namespace/pod selector, so it takes an ipBlock -- and the
    # match happens after kube-proxy has DNAT'd the kubernetes Service, so
    # these must be the apiserver's real endpoint addresses (every
    # control-plane node, on its secure port), never the 10.43.0.1 ClusterIP.
    # A rule written against the ClusterIP matches nothing and the request is
    # rejected: `dial tcp 10.43.0.1:443: connect: connection refused`.
    - to:
{{- range .Values.networkPolicy.kubernetesAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.kubernetesAPIServerPort }}}
    # the object-store namespace, on its private S3 API port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
      ports:
        - protocol: TCP
          port: 3900
    # backend (iam-service, for quota checks)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 8080
    # OTLP trace/metric export to the OpenTelemetry collector in monitoring.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
  {{- end }}
{{- end }}
