{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "storage-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken defaults true (see values.yaml) because this
# service is a genuine Kubernetes API client — the sibling iam-service
# chart sets this false since it never calls the API.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
