suite: compute-service instance pull-secret contract
release:
  name: compute-service
  namespace: backend
set:
  image:
    tag: t
tests:
  - it: passes the configured pull-secret names to compute-service
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_PULL_SECRET_NAME
            value: instance-registry-pull
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_PULL_SECRET_SOURCE
            value: ghcr-pull-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_PULL_SECRET_SOURCE_NAMESPACE
            value: backend

  - it: grants access to only the configured source Secret
    template: role-pullsecret-reader.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: backend
      - equal:
          path: rules[0].resourceNames
          value: [ghcr-pull-credentials]

  - it: binds the backend compute-service account in the source namespace
    template: role-pullsecret-reader.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.namespace
          value: backend
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: compute-service
            namespace: backend
