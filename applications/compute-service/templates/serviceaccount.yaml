{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compute-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compute-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken is true because compute-service is a genuine
# Kubernetes API client: it provisions fci-cust-* namespaces and manages
# workload RBAC. Setting this false breaks all namespace lifecycle calls.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
