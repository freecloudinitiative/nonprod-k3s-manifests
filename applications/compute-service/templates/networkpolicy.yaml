{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compute-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compute-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compute-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # api-gateway and other backend-namespace peers reach the API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    # Prometheus scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # platform-database (Postgres)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-database
      ports:
        - protocol: TCP
          port: 5432
    # valkey (quota cache and optional events)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # Kubernetes API server for namespace lifecycle management.
    # endpoint as a namespace/pod selector, so it takes an ipBlock -- and the
    # match happens after kube-proxy has DNAT'd the kubernetes Service, so
    # these must be the apiserver's real endpoint addresses (every
    # control-plane node, on its secure port), never the 10.43.0.1 ClusterIP.
    # A rule written against the ClusterIP matches nothing and the request is
    # rejected: `dial tcp 10.43.0.1:443: connect: connection refused`.
    {{- if or (not .Values.networkPolicy.kubernetesAPIServerCIDRs) (not .Values.networkPolicy.kubernetesAPIServerPort) }}
    {{- fail "networkPolicy.kubernetesAPIServerCIDRs and .kubernetesAPIServerPort are both required: an egress rule whose peer list or port renders empty is read by NetworkPolicy as every destination, or every port on the control plane." }}
    {{- end }}
    - to:
{{- range .Values.networkPolicy.kubernetesAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.kubernetesAPIServerPort }}}
    # backend (iam-service for quota checks)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus queries (customer-facing Metrics tab) and OTLP trace/metric
    # export to the OpenTelemetry collector, both in monitoring.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 4317
    {{- if .Values.backup.enabled }}
    # garage — the backup scheduler deletes expired backup objects
    # directly from Garage's S3 API during retention sweeps.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
      ports:
        - protocol: TCP
          port: 3900
    {{- end }}
    # customer namespaces — compute-service creates and manages workloads
    # in fci-cust-* namespaces. The wildcard cannot be expressed in a
    # NetworkPolicy namespaceSelector; runtime access is enforced by RBAC
    # (ClusterRole + per-namespace RoleBinding) rather than NetworkPolicy.
    # This egress rule therefore targets the Kubernetes API server via the
    # ipBlock above, which is the transport for all namespace operations.
  {{- end }}
{{- end }}
