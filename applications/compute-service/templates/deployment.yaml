apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compute-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compute-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "compute-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compute-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "compute-service.serviceAccountName" . }}
      # terminationGracePeriodSeconds must exceed ShutdownGrace so the
      # reconcile worker can fully drain before kubelet sends SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: compute-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "compute-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: compute-service
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | default "info" | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.containerPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: SHUTDOWN_GRACE
              value: {{ .Values.config.shutdownGrace | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresqlCredentials.secretName }}
                  key: url
            - name: DATABASE_SCHEMA
              value: compute
            - name: DB_MAX_CONNS
              value: "10"
            - name: INTERNAL_SIGNING_KEY_PATH
              value: /etc/compute-service/signing/internal-signing.key
            - name: INTERNAL_TOKEN_TTL
              value: {{ .Values.internalTokenTTL | quote }}
            - name: INTERNAL_PUBLIC_KEY_PATH
              value: /etc/compute-service/internal/internal-public.pem
            - name: TERMINAL_GATEWAY_PUBLIC_KEY_PATH
              value: /etc/compute-service/terminal-gateway/terminal-gateway-public.pem
            - name: DATABASE_SERVICE_PUBLIC_KEY_PATH
              value: /etc/compute-service/database-service/internal-public.pem
            - name: SERVICE_AUDIENCE
              value: compute-service
            - name: IAM_SERVICE_URL
              value: {{ .Values.quota.iamServiceURL | quote }}
            - name: QUOTA_CACHE_TTL
              value: {{ .Values.quota.cacheTTL | quote }}
            - name: IAM_TIMEOUT
              value: {{ .Values.quota.iamTimeout | quote }}
            - name: VALKEY_URL
              value: {{ .Values.config.valkeyURL | quote }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.valkey.secretName }}
                  key: {{ .Values.secrets.valkey.keyName }}
            - name: VALKEY_CA_CERT_PATH
              value: /etc/compute-service/valkey/ca.crt
            - name: KUBERNETES_ENABLED
              value: {{ .Values.kubernetes.enabled | quote }}
            {{- if .Values.kubernetes.enabled }}
            - name: KUBERNETES_IN_CLUSTER
              value: {{ .Values.kubernetes.inCluster | quote }}
            - name: KUBERNETES_QPS
              value: {{ .Values.kubernetes.qps | quote }}
            - name: KUBERNETES_BURST
              value: {{ .Values.kubernetes.burst | quote }}
            - name: KUBERNETES_TIMEOUT
              value: "{{ .Values.kubernetes.timeoutSeconds }}s"
            - name: KUBERNETES_NAMESPACE_PREFIX
              value: {{ .Values.kubernetes.namespacePrefix | quote }}
            - name: KUBERNETES_SERVICE_ACCOUNT
              value: {{ .Values.kubernetes.serviceAccountName | quote }}
            - name: KUBERNETES_SERVICE_ACCOUNT_NAMESPACE
              value: {{ .Values.kubernetes.serviceAccountNamespace | quote }}
            - name: TERMINAL_GATEWAY_SERVICE_ACCOUNT
              value: {{ .Values.kubernetes.terminalGatewayServiceAccountName | quote }}
            - name: TERMINAL_GATEWAY_SERVICE_ACCOUNT_NAMESPACE
              value: {{ .Values.kubernetes.terminalGatewayServiceAccountNamespace | quote }}
            - name: INSTANCE_PULL_SECRET_NAME
              value: {{ .Values.instancePullSecret.name | quote }}
            - name: INSTANCE_PULL_SECRET_SOURCE
              value: {{ .Values.instancePullSecret.sourceName | quote }}
            - name: INSTANCE_PULL_SECRET_SOURCE_NAMESPACE
              value: {{ .Values.instancePullSecret.sourceNamespace | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.reconcile.interval | quote }}
            - name: RECONCILE_BATCH_SIZE
              value: {{ .Values.reconcile.batchSize | quote }}
            - name: RECONCILE_STALE_AFTER
              value: {{ .Values.reconcile.staleAfter | quote }}
            - name: RECONCILE_MAX_ATTEMPTS
              value: {{ .Values.reconcile.maxAttempts | quote }}
            - name: RESYNC_INTERVAL
              value: {{ .Values.reconcile.resyncInterval | quote }}
            {{- end }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: PROMETHEUS_URL
              value: {{ .Values.metrics.prometheusURL | quote }}
            - name: PROMETHEUS_TIMEOUT
              value: {{ .Values.metrics.prometheusTimeout | quote }}
            - name: METRICS_CACHE_TTL
              value: {{ .Values.metrics.metricsCacheTTL | quote }}
            {{- end }}
            - name: INSTANCE_TYPE_CACHE_TTL
              value: {{ .Values.instanceTypeCacheTTL | quote }}
            - name: BACKUP_ENABLED
              value: {{ .Values.backup.enabled | quote }}
            {{- if .Values.backup.enabled }}
            {{- if not (regexMatch "@sha256:[0-9a-f]{64}$" .Values.backup.jobImage) }}
            {{- fail "backup.jobImage must be digest-pinned (…@sha256:<64 hex>) when backup.enabled is true" }}
            {{- end }}
            - name: BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            - name: BACKUP_RETENTION_DAYS
              value: {{ .Values.backup.retentionDays | quote }}
            - name: BACKUP_CONCURRENCY_PER_NODE
              value: {{ .Values.backup.concurrencyPerNode | quote }}
            - name: BACKUP_JOB_IMAGE
              value: {{ .Values.backup.jobImage | quote }}
            - name: BACKUP_ENDPOINT
              value: {{ .Values.backup.bucketEndpoint | quote }}
            - name: BACKUP_REGION
              value: {{ .Values.backup.region | quote }}
            - name: BACKUP_ACCESS_KEY_FILE
              value: /etc/compute-service/backup-objectstore/access-key
            - name: BACKUP_SECRET_KEY_FILE
              value: /etc/compute-service/backup-objectstore/secret-key
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # bare host:port, no scheme — platform-common rejects a URL scheme for OTLP gRPC
              value: {{ .Values.config.otelEndpoint | quote }}
            # Downward API for OTel resource attributes.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: postgresql-ca
              mountPath: /etc/compute-service/postgres
              readOnly: true
            - name: signing-key
              mountPath: /etc/compute-service/signing
              readOnly: true
            - name: internal-public-key
              mountPath: /etc/compute-service/internal
              readOnly: true
            - name: terminal-gateway-public-key
              mountPath: /etc/compute-service/terminal-gateway
              readOnly: true
            - name: database-service-public-key
              mountPath: /etc/compute-service/database-service
              readOnly: true
            - name: valkey-ca
              mountPath: /etc/compute-service/valkey
              readOnly: true
            {{- if .Values.backup.enabled }}
            - name: backup-objectstore-credentials
              mountPath: /etc/compute-service/backup-objectstore
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      volumes:
        - name: postgresql-ca
          secret:
            secretName: {{ .Values.secrets.postgresqlCA.secretName }}
        - name: signing-key
          secret:
            secretName: {{ .Values.secrets.signingKey.secretName }}
            items:
              - key: {{ .Values.secrets.signingKey.keyName }}
                path: internal-signing.key
            defaultMode: 0400
        - name: internal-public-key
          secret:
            secretName: {{ .Values.secrets.internalPublicKey.secretName }}
            items:
              - key: {{ .Values.secrets.internalPublicKey.keyName }}
                path: internal-public.pem
            defaultMode: 0444
        - name: terminal-gateway-public-key
          secret:
            secretName: {{ .Values.secrets.terminalGatewayPublicKey.secretName }}
            items:
              - key: {{ .Values.secrets.terminalGatewayPublicKey.keyName }}
                path: terminal-gateway-public.pem
            defaultMode: 0444
        - name: database-service-public-key
          secret:
            secretName: {{ .Values.secrets.databaseServicePublicKey.secretName }}
            optional: true
            items:
              - key: {{ .Values.secrets.databaseServicePublicKey.keyName }}
                path: internal-public.pem
            defaultMode: 0444
        - name: valkey-ca
          secret:
            secretName: {{ .Values.secrets.valkeyCACert.secretName }}
            items:
              - key: {{ .Values.secrets.valkeyCACert.keyName }}
                path: ca.crt
            defaultMode: 0444
        {{- if .Values.backup.enabled }}
        # Reuses storage-service's Garage credentials — not chart-owned by
        # compute-service — so the backup scheduler can delete expired
        # objects directly from Garage without a second copy of the
        # credential. See CHARTS.md's Direct-Call Public Keys precedent for
        # this hardcoded-cross-service-Secret-name pattern.
        - name: backup-objectstore-credentials
          secret:
            secretName: storage-service-objectstore-credentials
            defaultMode: 0444
            items:
              - key: access-key
                path: access-key
              - key: secret-key
                path: secret-key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
