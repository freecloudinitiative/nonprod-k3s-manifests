apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-rpc-password
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Garage requires the RPC secret to be exactly 32 bytes of hex (64 hex
  # chars). encoding: hex encodes `length` raw bytes as hex, doubling the
  # output length — length: 32 here yields the 64 hex characters Garage
  # wants, confirmed against the live generator (length: 64 produced a
  # 128-char string, which Garage rejected: "expected 32 bytes of random
  # hex"). digits/symbols/noUpper are meaningless once hex-encoded.
  length: 32
  encoding: hex
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc-secret
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: garage-rpc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        rpcSecret: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-rpc-password
