# ExternalSecret for api-gateway: pulls the internal Ed25519 signing key and
# the Valkey password from OpenBao into the backend namespace.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "2" runs after the operator and ClusterSecretStore; the parent
# Application still precedes the api-gateway workload Application.
# attempt to mount them.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-signing-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: api-gateway-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-signing.key
      remoteRef:
        key: api-gateway
        property: internal-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-valkey-password
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: valkey-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-valkey-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: valkey-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: valkey
        property: ca-cert
