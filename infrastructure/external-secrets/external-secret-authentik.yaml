  target:
    name: platform-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: platform
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform-postgresql
        property: password
