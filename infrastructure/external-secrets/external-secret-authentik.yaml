apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: authentik-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .postgresqlPassword }}"
        AUTHENTIK_SECRET_KEY: "{{ .secretKey }}"
        GRAFANA_OIDC_SECRET: "{{ .grafanaOidcSecret }}"
        ARGOCD_OIDC_SECRET: "{{ .argocdOidcSecret }}"
  data:
    - secretKey: postgresqlPassword
      remoteRef:
        key: authentik
        property: postgresql-password
    - secretKey: secretKey
      remoteRef:
        key: authentik
        property: secret-key
    - secretKey: grafanaOidcSecret
      remoteRef:
        key: authentik
        property: grafana-oidc-secret
    - secretKey: argocdOidcSecret
      remoteRef:
        key: authentik
        property: argocd-oidc-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-bootstrap
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: authentik-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Single underscore, not double: authentik's env-to-config mapping
        # treats "__" as a nesting delimiter, so AUTHENTIK_BOOTSTRAP__EMAIL
        # would set a nonexistent "bootstrap.email" config path instead of
        # the special bootstrap_email/bootstrap_password keys the admin
        # bootstrap logic actually reads. With the double underscore, the
        # seeded credentials silently never took effect — akadmin ended up
        # with whatever authentik's own fallback produced, not this value.
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .bootstrapEmail }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrapPassword }}"
        # Authentik creates (or updates) an akadmin API token matching this
        # value at boot. This is what makes the admin-token single-run: Ansible
        # picks the value, seeds it into OpenBao, and Authentik just adopts it —
        # no manual UI token creation, no second ansible-playbook run.
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrapToken }}"
  data:
    - secretKey: bootstrapEmail
      remoteRef:
        key: authentik
        property: bootstrap-email
    - secretKey: bootstrapPassword
      remoteRef:
        key: authentik
        property: bootstrap-password
    - secretKey: bootstrapToken
      remoteRef:
        key: authentik
        property: admin-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-service-authentik-token
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: iam-service-authentik-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: authentik
        property: admin-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: authentik-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: authentik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: authentik
        property: postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-postgresql-credentials
