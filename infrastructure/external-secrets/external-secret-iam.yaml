# ExternalSecrets for iam-service: Postgres role credentials in
# platform-database, plus chart-facing Postgres credentials, CA, and the
# api-gateway public verification key in backend.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "2" runs after the operator and ClusterSecretStore; the parent
# Application still precedes the platform-postgresql and workload Applications.
# (wave "1") and before iam-service pods attempt to mount it.
---
# CNPG's DatabaseRole.spec.passwordSecret is a same-namespace Secret
# reference resolved wherever the DatabaseRole itself is reconciled — the
# platform-postgresql Argo Application's destination namespace,
# platform-database (see infrastructure/platform-postgresql/app.yaml) —
# never wherever the consuming service happens to live. A copy in backend
# would be invisible to CNPG's reconcile and the role's password would
# silently never update. See external-secret-storage.yaml:11-19 for the
# full rationale.
#
# OpenBao prerequisite: the key iam/postgresql-password must exist in
# OpenBao at secret/data/iam (KV v2). OpenBao is seeded out of band; an
# ExternalSecret pointing at a missing key stays SecretSyncedError forever
# with no other signal. Backend-namespace copies consumed by iam-service
# pods are created in PR-04.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: iam-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: iam
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: iam
        property: postgresql-password
---
# The chart-facing copy: iam-service reads DATABASE_URL from this Secret's
# `url` key in namespace backend. The password is percent-encoded before it is
# placed in URI userinfo; urlquery emits spaces as `+`, so replace that with
# `%20`, which round-trips correctly outside a query string. sslrootcert is
# coupled to the mount path recorded in APPS.md and provided by
# iam-service-postgresql-ca-cert below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-service-postgresql-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: iam-service-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: 'postgres://iam:{{ .password | urlquery | replace "+" "%20" }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/etc/iam-service/postgres/ca.crt'
  data:
    - secretKey: password
      remoteRef:
        key: iam
        property: postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-service-postgresql-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: iam-service-postgresql-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-postgresql
        property: ca-cert
---
# iam-service verifies api-gateway tokens but never receives the private key.
# The second verifier mounts the shared terminal-gateway-public-key Secret,
# which is owned by external-secret-terminal.yaml; do not duplicate it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: iam-service-internal-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
---
# The public halves of compute-service's, database-service's, and
# storage-service's own signing keys (private halves in
# external-secret-compute.yaml, -database.yaml, -storage.yaml). iam-service
# trusts each as a distinct issuer via platform-common's NewVerifierMulti,
# which binds issuer to key — do not collapse these into a single shared
# Secret the way terminal-gateway-public-key is shared.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: compute
        property: internal-public-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-service-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: database
        property: internal-public-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: storage
        property: internal-public-key
