# ExternalSecret for storage-service: Postgres credentials + CA, object
# store credentials + CA, Valkey password + CA, and the internal Ed25519
# public key used to verify inbound internal calls.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "2" runs after the operator and ClusterSecretStore; the parent
# Application still precedes the storage-service workload Application.
# pods attempt to mount them.
---
# CNPG's DatabaseRole.spec.passwordSecret is a same-namespace Secret
# reference resolved wherever the DatabaseRole itself is reconciled — the
# platform-postgresql Argo Application's destination namespace,
# platform-database (see infrastructure/platform-postgresql/app.yaml) —
# never wherever the consuming service happens to live. This mirrors
# authentik-postgresql-credentials, which is namespace: platform-database
# for the exact same reason. A copy of this secret in backend would be
# invisible to CNPG's reconcile and the role's password would silently
# never update.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: storage
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: storage
        property: postgresql-password
---
# The chart-facing copy: storage-service's Deployment reads DATABASE_URL
# from this Secret's `url` key via secretKeyRef, in the backend namespace
# where the pods actually run. Same underlying OpenBao password as
# storage-postgresql-credentials above — sslrootcert points at the CA
# bundle mounted from storage-service-postgresql-ca-cert below, so the two
# secrets in this namespace are consumed together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-postgresql-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: 'postgres://storage:{{ .password | urlquery | replace "+" "%20" }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/etc/storage-service/postgres/ca.crt'
  data:
    - secretKey: password
      remoteRef:
        key: storage
        property: postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-postgresql-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-postgresql-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-postgresql
        property: ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-valkey-password
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-valkey-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-valkey-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-valkey-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: valkey
        property: ca-cert
---
# storage-service verifies inbound internal calls (from api-gateway) but
# never signs its own — only the public half is mounted here. Mirrors the
# terminal-gateway-public-key pattern: the signing service owns the private
# key, every verifier gets only the public one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-internal-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
---
# storage-service's own Ed25519 key pair, distinct from the verifier key
# above. storage-service mints internal JWTs with this private key to call
# iam-service's quota route; the public half is mounted on iam-service by
# external-secret-iam.yaml's storage-service-public-key ExternalSecret.
#
# OpenBao prerequisite: secret/data/storage must carry an internal-signing-key
# property (Ed25519 PEM, PKCS8) alongside its existing postgresql-password,
# with a matching internal-public-key property (PKIX PEM) for the iam-service
# side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-signing-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-signing.key
      remoteRef:
        key: storage
        property: internal-signing-key
---
# Object store (garage) credentials + CA. Mounted as files by the chart —
# never injected as process environment — per prs/PR-11-helm-chart-rbac.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-objectstore-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-objectstore-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: garage
        property: storage-service-access-key
    - secretKey: secret-key
      remoteRef:
        key: garage
        property: storage-service-secret-key
    - secretKey: ca.crt
      remoteRef:
        key: garage
        property: ca-cert
