apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-openbao-token-request
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - external-secrets-openbao
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-openbao-token-request
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-openbao-token-request
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
