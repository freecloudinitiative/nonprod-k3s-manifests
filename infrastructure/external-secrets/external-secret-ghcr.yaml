# Docker registry credentials for FCI workloads in namespace backend.
#
# OpenBao prerequisite: secret/data/ghcr-registry must contain the plaintext
# properties ghcr-username and ghcr-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: ghcr-pull-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .ghcrUsername .ghcrToken | b64enc }}"
              }
            }
          }
  data:
    - secretKey: ghcrUsername
      remoteRef:
        key: ghcr-registry
        property: ghcr-username
    - secretKey: ghcrToken
      remoteRef:
        key: ghcr-registry
        property: ghcr-token
