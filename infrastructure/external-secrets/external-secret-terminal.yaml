# terminal-gateway owns a dedicated Ed25519 key pair. Only the private key is
# mounted by terminal-gateway; compute-service and iam-service receive the
# public half so they can verify direct internal calls from issuer
# "terminal-gateway" without sharing another service's signing authority.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terminal-gateway-signing-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: terminal-gateway-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-signing.key
      remoteRef:
        key: terminal-gateway
        property: internal-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terminal-gateway-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: terminal-gateway-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: terminal-gateway
        property: internal-public-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terminal-gateway-valkey-password
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: terminal-gateway-valkey-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terminal-gateway-valkey-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: terminal-gateway-valkey-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: valkey
        property: ca-cert
