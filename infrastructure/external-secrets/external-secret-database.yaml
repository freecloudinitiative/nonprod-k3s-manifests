# ExternalSecret for database-service: Postgres credentials in platform-database.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "2" runs after the operator and ClusterSecretStore; the parent
# Application still precedes the platform-postgresql and workload Applications.
# (wave "1") and before database-service pods attempt to mount it.
---
# CNPG's DatabaseRole.spec.passwordSecret is a same-namespace Secret
# reference resolved wherever the DatabaseRole itself is reconciled — the
# platform-postgresql Argo Application's destination namespace,
# platform-database (see infrastructure/platform-postgresql/app.yaml) —
# never wherever the consuming service happens to live. A copy in backend
# would be invisible to CNPG's reconcile and the role's password would
# silently never update. See external-secret-storage.yaml:11-19 for the
# full rationale.
#
# OpenBao prerequisite: the key database/postgresql-password must exist in
# OpenBao at secret/data/database (KV v2). OpenBao is seeded out of band; an
# ExternalSecret pointing at a missing key stays SecretSyncedError forever
# with no other signal. Backend-namespace copies consumed by database-service
# pods are created in PR-03, which extends this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: database
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: database
        property: postgresql-password
---
# The chart-facing copy: database-service's Deployment reads DATABASE_URL
# from this Secret's `DATABASE_URL` key via secretKeyRef, in the backend
# namespace where the pods actually run (confirmed from
# applications/database-service/templates/deployment.yaml: secretKeyRef
# {name: database-service-config, key: DATABASE_URL}). The key is literally
# DATABASE_URL — not `url` as in storage-service-postgresql-credentials.
# sslrootcert points at /certs/platform-postgresql/ca.crt, which is the
# exact path the chart mounts: volumeMounts.mountPath=/certs/platform-postgresql
# + items[].path=ca.crt.
#
# CA parallel: platform-postgresql-ca-bundle ExternalSecret (below) provides
# the CA at wave 2 in the same Application as this secret. sslmode=verify-full
# requires both this Secret and the CA Secret to exist before the pod starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-config
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-service-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://database:{{ .password | urlquery | replace "+" "%20" }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/certs/platform-postgresql/ca.crt'
  data:
    - secretKey: password
      remoteRef:
        key: database
        property: postgresql-password
---
# CA bundle for database-service in namespace backend.
#
# Why ExternalSecret (option b) rather than a cert-manager Certificate:
#   A Certificate placed in infrastructure/platform-postgresql/ belongs to the
#   platform-postgresql Argo Application (sync-wave "4"). The database-service
#   Application has no sync-wave annotation (defaults to wave 0) and starts
#   before the platform-postgresql Application is ever processed. A resource-level
#   wave annotation on a Certificate in a wave-4 Application has no ordering
#   relationship with a wave-0 Application — the Secret would simply not exist
#   when the pod tries to mount it. Using an ExternalSecret here places the CA
#   Secret in the external-secrets Application (wave "2") alongside the other
#   backend secrets, guaranteeing it lands well before wave-0 workloads start.
#
# OpenBao prerequisite: secret/data/platform-postgresql, property ca-cert.
#   This is the same path storage-service-postgresql-ca-cert reads (confirmed
#   from external-secret-storage.yaml:97-100). Both services verify TLS against
#   the same Postgres CA; they share the OpenBao key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-postgresql-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: platform-postgresql-ca-bundle
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-postgresql
        property: ca-cert
---
# database-service verifies inbound internal calls (from api-gateway) but never
# signs its own — only the public half is mounted here. The private half lives
# in api-gateway-signing-key (external-secret-gateway.yaml). Sourced from the
# same OpenBao key as storage-service-internal-public-key (api-gateway /
# internal-public-key) — a mismatched pair produces 401s that look like a
# client bug, so the source must be the public counterpart of the exact private
# key api-gateway uses to sign tokens.
#
# Follow-up: the chart names this Secret `internal-token-public-key` rather
# than `database-service-internal-public-key`. This is an inconsistency with
# the storage-service naming convention. Renaming requires a chart change in
# the database-service repo — tracked as a follow-up, not fixed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: internal-token-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
---
# database-service's own Ed25519 key pair, distinct from the verifier key
# above. database-service mints internal JWTs with this private key to call
# iam-service's quota route; the public half is mounted on iam-service by
# external-secret-iam.yaml's database-service-public-key ExternalSecret.
#
# OpenBao prerequisite: secret/data/database must carry an internal-signing-key
# property (Ed25519 PEM, PKCS8) alongside its existing postgresql-password,
# with a matching internal-public-key property (PKIX PEM) for the iam-service
# side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-signing-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-service-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-signing.key
      remoteRef:
        key: database
        property: internal-signing-key
