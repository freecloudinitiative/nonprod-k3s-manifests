# ExternalSecrets for compute-service: Postgres role credentials in
# platform-database, plus chart-facing Postgres, Valkey, CA, and api-gateway
# public verification key material in backend.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "2" runs after the operator and ClusterSecretStore; the parent
# Application still precedes the platform-postgresql and workload Applications.
# (wave "1") and before compute-service pods attempt to mount it.
---
# CNPG's DatabaseRole.spec.passwordSecret is a same-namespace Secret
# reference resolved wherever the DatabaseRole itself is reconciled — the
# platform-postgresql Argo Application's destination namespace,
# platform-database (see infrastructure/platform-postgresql/app.yaml) —
# never wherever the consuming service happens to live. A copy in backend
# would be invisible to CNPG's reconcile and the role's password would
# silently never update. See external-secret-storage.yaml:11-19 for the
# full rationale.
#
# OpenBao prerequisite: the key compute/postgresql-password must exist in
# OpenBao at secret/data/compute (KV v2). OpenBao is seeded out of band; an
# ExternalSecret pointing at a missing key stays SecretSyncedError forever
# with no other signal. Backend-namespace copies consumed by compute-service
# pods are created in PR-04.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: compute
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: compute
        property: postgresql-password
---
# The chart-facing copy: compute-service reads DATABASE_URL from this Secret's
# `url` key in namespace backend. The password is percent-encoded before it is
# placed in URI userinfo; urlquery emits spaces as `+`, so replace that with
# `%20`, which round-trips correctly outside a query string. sslrootcert is
# coupled to the mount path recorded in APPS.md and provided by
# compute-service-postgresql-ca-cert below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-postgresql-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: 'postgres://compute:{{ .password | urlquery | replace "+" "%20" }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/etc/compute-service/postgres/ca.crt'
  data:
    - secretKey: password
      remoteRef:
        key: compute
        property: postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-postgresql-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-postgresql-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-postgresql
        property: ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-valkey-password
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-valkey-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-valkey-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-valkey-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: valkey
        property: ca-cert
---
# compute-service verifies api-gateway tokens but never receives the private
# key. Its second verifier mounts the shared terminal-gateway-public-key
# Secret, owned by external-secret-terminal.yaml; do not duplicate it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-internal-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
---
# compute-service's own Ed25519 key pair, distinct from the verifier key
# above. compute-service mints internal JWTs with this private key to call
# iam-service's quota route; the public half is mounted on iam-service by
# external-secret-iam.yaml's compute-service-public-key ExternalSecret.
#
# OpenBao prerequisite: secret/data/compute must carry an internal-signing-key
# property (Ed25519 PEM, PKCS8) alongside its existing postgresql-password,
# with a matching internal-public-key property (PKIX PEM) for the iam-service
# side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: compute-service-signing-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: compute-service-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-signing.key
      remoteRef:
        key: compute
        property: internal-signing-key
