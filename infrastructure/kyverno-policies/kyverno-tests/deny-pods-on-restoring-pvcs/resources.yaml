# Case 5: Pod mounting one unlocked and one locked PVC -> fail
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-unlocked-2
  namespace: fci-cust-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-locked-d
  namespace: fci-cust-test
  annotations:
    fci.io/restore-id: "44444444-4444-4444-4444-444444444444"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-mixed-mounts
  namespace: fci-cust-test
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.internal/app:1.0
      resources:
