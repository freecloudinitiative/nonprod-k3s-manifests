apiVersion: v1
kind: Namespace
metadata:
  name: fci-cust-test
  labels:
    fci.io/tier: customer
---
apiVersion: v1
kind: Namespace
metadata:
  name: fci-platform-test
  labels:
    fci.io/tier: platform
---
# Case 1: unannotated PVC + guest Pod -> pass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-unlocked
  namespace: fci-cust-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-guest-unlocked
  namespace: fci-cust-test
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.internal/app:1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          memory: 128Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-unlocked
---
# Case 2: annotated PVC + guest Pod (no restore label) -> fail
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-locked-a
  namespace: fci-cust-test
  annotations:
    fci.io/restore-id: "11111111-1111-1111-1111-111111111111"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-guest-locked-a
  namespace: fci-cust-test
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.internal/app:1.0
      resources:
