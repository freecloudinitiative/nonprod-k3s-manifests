          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          memory: 128Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-locked-a
---
# Case 3: annotated PVC + matching restore label -> pass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-locked-b
  namespace: fci-cust-test
  annotations:
    fci.io/restore-id: "22222222-2222-2222-2222-222222222222"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-restore-b
  namespace: fci-cust-test
  labels:
    fci.io/restore-id: "22222222-2222-2222-2222-222222222222"
spec:
  automountServiceAccountToken: false
  containers:
    - name: restore
      image: registry.internal/restore-worker:1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          memory: 128Mi
  volumes:
    - name: target
      persistentVolumeClaim:
        claimName: pvc-locked-b
---
# Case 4: annotated PVC + different restore label value -> fail
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
