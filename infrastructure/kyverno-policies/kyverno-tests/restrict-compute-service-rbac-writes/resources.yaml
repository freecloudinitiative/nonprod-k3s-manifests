# role-workloads-exact and role-terminal-exact are copied verbatim from
# compute-service/internal/k8s/rbac.go EnsureNamespaceRBAC. When that function
# changes, change these first and watch this test fail — that failure is the
# signal to widen restrict-compute-service-rbac-writes.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-service-workloads
  namespace: fci-cust-role-workloads-exact
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terminal-gateway-exec
  namespace: fci-cust-role-terminal-exact
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # Intentional test fixture: terminal-gateway requires create on the
    # pods/exec subresource to establish customer console sessions.
    resources: ["pods/exec"]  # NOSONAR
    verbs: ["create"]
---
