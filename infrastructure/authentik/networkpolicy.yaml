apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9300
    # api-gateway fetches JWKS from Authentik on port 9000 to validate every
    # inbound JWT. Without this rule, JWKS fetching fails silently and every
    # authenticated request returns 401 — while Authentik itself looks healthy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 9000
    # The footer-links Job PATCHes the tenant settings API, which is the only
    # way to set the login page's footer links -- blueprints cannot touch the
    # Tenant model. k3s SNATs cross-node Service traffic to the private
    # node-overlay address, so keep the pod selector and admit that CIDR as a
    # fallback.
    - from:
        - podSelector:
            matchLabels:
              fci.io/role: authentik-footer-links
        - ipBlock:
            cidr: 10.1.1.0/24
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-database
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
