apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-wave-health: all
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    # Kyverno ships PreDelete hooks. Argo CD adds these finalizers at runtime;
    # declaring them keeps the parent app-of-apps from reporting permanent
    # drift on the child Application.
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.8.1
      helm:
        valueFiles:
          - $values/infrastructure/kyverno/values.yaml
    - repoURL: https://github.com/freecloudinitiative/nonprod-k3s-manifests.git
      targetRevision: main
      path: infrastructure/kyverno
      ref: values
      directory:
        include: 'values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
        - /status
        # The policies.kyverno.io CRDs (validatingpolicies, mutatingpolicies,
        # imagevalidatingpolicies, etc.) sit near etcd's per-object size
        # limit. Argo cannot safely stamp its tracking annotation or the
        # chart's helm.sh/app.kubernetes.io labels onto them without risking
        # a write rejection, so these CRDs are applied with no metadata at
        # all and will never match the chart's desired labels/annotations.
        - /metadata/labels
        - /metadata/annotations
