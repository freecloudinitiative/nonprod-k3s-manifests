tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

alloy:
  clustering:
    enabled: false

  uiPathPrefix: /alloy

  configMap:
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      // Receive OTLP from apps
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
          logs    = [otelcol.exporter.loki.default.input]
        }
      }

      // Convert OTLP metrics to Prometheus remote write format
      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // Convert OTLP logs to Loki format
      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // Send traces to Tempo
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // Send logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-external.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // Collect Kubernetes Pod logs
      discovery.kubernetes "pod_logs" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod_logs.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "replace"
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // Scrape Prometheus metrics
      prometheus.scrape "default" {
        targets = [
          {"__address__" = "kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"},
        ]
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // Send metrics to Prometheus
      prometheus.remote_write "default" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }
