apiVersion: v1
kind: Service
metadata:
  name: alloy-external
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  # The UI is exposed by Traefik; OTLP remains cluster-internal.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - port: 12345
      targetPort: 12345
      name: http-metrics
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
