apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgresql-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: platform-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: platform-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              fci.io/role: db-bootstrap
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
        # The `backend` namespace hosts multiple services (api-gateway,
        # iam-service, compute-service, storage-service, ...), each with
        # its own `app` label. The old `app: backend` selector matched
        # none of them — a silent connection timeout at startup, not an
        # error. Every backend-namespace chart that talks to Postgres
        # carries the shared `fci.io/tier: backend` label instead (see
        # storage-service's applications/storage-service/templates/_helpers.tpl), introduced by
        # storage-service PR-11 and reused by compute-service PR-17.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
          podSelector:
            matchLabels:
              fci.io/tier: backend
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
