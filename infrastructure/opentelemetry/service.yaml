# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector-external
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  # Internal-only in nonprod. No AWS load balancer or MetalLB is provisioned.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentelemetry-collector
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
      protocol: TCP
    - port: 4318
      targetPort: 4318
      name: otlp-http
      protocol: TCP
    - port: 8888
      targetPort: 8888
      name: metrics
      protocol: TCP
