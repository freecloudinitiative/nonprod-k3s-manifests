# yaml-language-server: $schema=https://www.schemastore.org/any.json
image:
  repository: docker.io/otel/opentelemetry-collector-contrib

mode: deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 256
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    # The dedicated Loki exporter was removed from recent Collector releases.
    # Loki accepts native OTLP/HTTP logs at /otlp/v1/logs; the exporter appends
    # /v1/logs to this base endpoint.
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local:80/otlp
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki, debug]
